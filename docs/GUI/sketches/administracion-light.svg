70" y="348" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#202020" font-weight="600">Configuración</text><text x="30" y="823" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#454545" font-weight="400">Datos sintéticos</text><text x="288" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#454545" font-weight="400">ESTUDIO DE INTERFAZ / SKETCH</text><text x="288" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="36" fill="#202020" font-weight="700">Operación con trazabilidad</text><text x="288" y="152" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#454545" font-weight="400">Solo agregados autorizados · Sin acceso a rutinas privadas</text><rect x="1110" y="82" width="282" height="48" rx="2" fill="#202020" stroke="#202020" stroke-width="1" stroke-dasharray="6 4"/><text x="1126" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#FFFFFF" font-weight="600">Consultar auditoría</text><rect x="288" y="200" width="350" height="146" rx="2" fill="#FFFFFF" stroke="#777777" stroke-width="1" stroke-dasharray="6 4"/><text x="312" y="232" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#454545" font-weight="400">Catálogo</text><text x="312" y="279" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#202020" font-weight="700">12 plantillas</text><text x="312" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#454545" font-weight="400">Ejemplo agregado</text><rect x="662" y="200" width="350" height="146" rx="2" fill="#FFFFFF" stroke="#777777" stroke-width="1" stroke-dasharray="6 4"/><text x="686" y="232" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#454545" font-weight="400">Estado</text><text x="686" y="279" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#202020" font-weight="700">Disponible</text><text x="686" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#454545" font-weight="400">Sin datos personales</text><rect x="1036" y="200" width="350" height="146" rx="2" fill="#FFFFFF" stroke="#777777" stroke-width="1" stroke-dasharray="6 4"/><text x="1060" y="232" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#454545" font-weight="400">Control</text><text x="1060" y="279" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#202020" font-weight="700">Motivo requerido</text><text x="1060" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#454545" font-weight="400">Operaciones auditadas</text><rect x="288" y="378" width="722" height="340" rx="2" fill="#FFFFFF" stroke="#777777" stroke-width="1" stroke-dasharray="6 4"/><text x="312" y="420" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#202020" font-weight="700">Catálogo de plantillas</text><rect x="312" y="452" width="674" height="64" rx="2" fill="#FFFFFF" stroke="#777777" stroke-width="1" stroke-dasharray="6 4"/><text x="330" y="477" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#202020" font-weight="600">Pausa consciente</text><text x="330" y="501" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#454545" font-weight="400">Activa · Versión 2</text><text x="847" y="489" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#202020" font-weight="400">Revisar →</text><rect x="312" y="528" width="674" height="64" rx="2" fill="#FFFFFF" stroke="#777777" stroke-width="1" stroke-dasharray="6 4"/><text x="330" y="553" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#202020" font-weight="600">Lectura diaria</text><text x="330" y="577" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#454545" font-weight="400">Activa · Versión 1</text><text x="847" y="565" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#202020" font-weight="400">Revisar →</text><rect x="312" y="604" width="674" height="64" rx="2" fill="#FFFFFF" stroke="#777777" stroke-width="1" stroke-dasharray="6 4"/><text x="330" y="629" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#202020" font-weight="600">Movimiento</text><text x="330" y="653" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#454545" font-weight="400">Pausada · Versión 3</text><text x="847" y="641" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#202020" font-weight="400">Revisar →</text><rect x="1034" y="378" width="378" height="340" rx="2" fill="#FFFFFF" stroke="#777777" stroke-width="1" stroke-dasharray="6 4"/><text x="1058" y="421" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#202020" font-weight="600">Antes de confirmar</text><text x="1058" y="466" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#202020" font-weight="400">Indica el motivo del cambio.</text><text x="1058" y="490" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#202020" font-weight="400">Cancelar no modifica la plantilla.</text><text x="1058" y="514" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#202020" font-weight="400">El historial se conserva.</text><text x="1058" y="538" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#202020" font-weight="400">Editar no cambia hábitos creados.</text><rect x="1058" y="620" width="330" height="48" rx="2" fill="#FFFFFF" stroke="#777777" stroke-width="1" stroke-dasharray="6 4"/><text x="1074" y="650" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#202020" font-weight="600">Revisar cambio</text><rect x="288" y="750" width="1124" height="82" rx="2" fill="#FFFFFF" stroke="#777777" stroke-width="1" stroke-dasharray="6 4"/><path d="M12 2l8 4v6c0 5-8 10-8 10S4 17 4 12V6Z" transform="translate(310 774) scale(1)" fill="none" stroke="#202020" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="780" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#202020" font-weight="400">La API debe comprobar permiso, motivo y revisión antes de aplicar el cambio.</text><text x="352" y="804" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#202020" font-weight="400">Vista de diseño: no ejecuta operaciones ni consulta cuentas reales.</text><text x="24" y="882" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#454545" font-weight="400">PROPUESTA · Datos sintéticos · 26 oct 2026</text></svg>