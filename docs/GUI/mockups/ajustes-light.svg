ily="Segoe UI,Arial,sans-serif" font-size="18" fill="#0B0F17" font-weight="600">Fuente biométrica</text><text x="40" y="461" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#283548" font-weight="400">Sin dispositivo vinculado</text><path d="M12 8v5l4 2 M12 2a10 10 0 1 0 0 20 10 10 0 1 0 0-20" transform="translate(40 475) scale(0.75)" fill="none" stroke="#0B0F17" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="491" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#0B0F17" font-weight="400">No se recopilan señales</text><text x="24" y="558" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#0B0F17" font-weight="400">Revocar impide nuevos usos y trabajos.</text><text x="24" y="582" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#0B0F17" font-weight="400">Cada fuente necesita su consentimiento.</text><text x="24" y="606" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#0B0F17" font-weight="400">Cambiar zona no reclasifica el historial.</text><rect x="24" y="652" width="342" height="48" rx="8" fill="#275BC0" stroke="#275BC0" stroke-width="1"/><text x="40" y="682" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#FFFFFF" font-weight="600">Guardar preferencias</text><rect x="24" y="716" width="342" height="48" rx="8" fill="#FFFFFF" stroke="#283548" stroke-width="1"/><text x="40" y="746" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#0B0F17" font-weight="600">Cancelar cambios</text><text x="24" y="826" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#283548" font-weight="400">PROPUESTA · Datos sintéticos · 26 oct 2026</text></svg>