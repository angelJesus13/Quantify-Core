<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Ideas con contexto</title><desc id="desc">Propuesta de diseño Quantify Core. Datos sintéticos. wireframe; tema light.</desc><rect x="0" y="0" width="390" height="844" rx="0" fill="#FFFFFF" stroke="#777777" stroke-width="1"/><text x="24" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#202020" font-weight="700">QUANTIFY CORE</text><text x="24" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#454545" font-weight="400">WIREFRAME / MÓVIL</text><text x="24" y="116" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#202020" font-weight="700">Ideas con contexto</text><text x="24" y="154" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#202020" font-weight="400">Recomendaciones voluntarias</text><rect x="24" y="194" width="342" height="232" rx="12" fill="#FFFFFF" stroke="#777777" stroke-width="1"/><path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3Z" transform="translate(172 222) scale(1.8)" fill="none" stroke="#202020" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="308" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#202020" font-weight="700">Aún faltan datos</text><text x="44" y="344" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#202020" font-weight="400">No hay información suficiente para</text><text x="44" y="368" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#202020" font-weight="400">una recomendación en este periodo.</text><text x="44" y="392" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#202020" font-weight="400">Puedes seguir registrando tus hábitos.</text><rect x="24" y="462" width="342" height="48" rx="8" fill="#202020" stroke="#202020" stroke-width="1"/><text x="40" y="492" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#FFFFFF" font-weight="600">Revisar mis hábitos</text><rect x="24" y="526" width="342" height="48" rx="8" fill="#FFFFFF" stroke="#777777" stroke-width="1"/><text x="40" y="556" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#202020" font-weight="600">Revisar consentimiento</text><text x="24" y="640" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#202020" font-weight="400">Cuando exista una sugerencia: mostrar</text><text x="24" y="664" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#202020" font-weight="400">fuentes, periodo, versión y limitaciones.</text><text x="24" y="688" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#202020" font-weight="400">Personalizar → guardar explícitamente.</text><text x="24" y="712" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#202020" font-weight="400">Cancelar no acepta la sugerencia.</text><text x="24" y="826" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#454545" font-weight="400">PROPUESTA · Datos sintéticos · 26 oct 2026</text></svg>